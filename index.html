<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频播放</title>
    <style>
        .play_btn {
            cursor: pointer;
            color: #409EFF;
            font-size: 16px;
            user-select: none;
        }
        .play_btn:hover {
            text-decoration: underline;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        audio {
            display: block;
            margin: 20px auto;
            width: 100%;
            max-width: 400px;
        }
        .error-msg {
            color: #ff6b6b;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app">
            <audio 
                v-if="urlValue && urlValue !== ''" 
                :src="'http://39.103.217.204:80' + urlValue" 
                :id="idValue"
                controls
                @error="handleError"
            ></audio>
            <span 
                class="play_btn" 
                @click="playAudio(idValue)" 
                v-if="urlValue && urlValue !== ''"
            >▶ 播放录音</span>
            <p v-if="errorMsg" class="error-msg">{{ errorMsg }}</p>
            <p v-if="!urlValue" style="color: #999;">正在加载...</p>
        </div>
    </div>

    <!-- 引入 Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.min.js"></script>
    
    <script>
        new Vue({
            el: '#app',
            data: {
                urlValue: '',
                idValue: '',
                errorMsg: ''
            },
            created() {
                const urlParams = new URLSearchParams(window.location.search);
                this.urlValue = urlParams.get('url') || '';
                this.idValue = urlParams.get('id') || 'audio_' + Date.now();
                console.log('音频地址:', 'http://39.103.217.204:80' + this.urlValue);
            },
            methods: {
                playAudio(audioId) {
                    const audio = document.getElementById(audioId);
                    if (!audio) {
                        this.errorMsg = '音频元素不存在';
                        return;
                    }
                    if (audio.paused) {
                        document.querySelectorAll('audio').forEach(item => {
                            if (item.id !== audioId) item.pause();
                        });
                        audio.play().catch(err => {
                            console.error('播放失败:', err);
                            this.errorMsg = '播放失败，请检查网络或重试';
                        });
                    } else {
                        audio.pause();
                    }
                },
                handleError() {
                    this.errorMsg = '音频加载失败，请检查地址是否正确';
                }
            }
        });
    </script>
</body>
</html>
